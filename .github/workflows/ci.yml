name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
        continue-on-error: true
      - run: npm run verify
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: .verify/shots
