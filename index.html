<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org data:; connect-src https://api.themoviedb.org https://api.movieofthenight.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="common.name">Where to Watch</title>
  <meta name="description" data-i18n="common.description" data-i18n-attr="content" content="Find where to watch any movie or series, and in which countries it is available on Netflix and other streaming services.">
  <meta name="theme-color">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/styles/search.css">
  <link rel="stylesheet" href="src/styles/title.css">
  <link rel="stylesheet" href="src/styles/settings.css">
  <link rel="stylesheet" href="src/styles/banners.css">
  <link rel="stylesheet" href="src/styles/about.css">
  <link rel="stylesheet" href="src/styles/install.css">
  <link rel="stylesheet" href="src/styles/footer.css">
  <script src="src/theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip"></a>
  <div class="page">
    <div id="header"></div>
    <main id="main" class="column">
      <div id="welcome" hidden></div>
      <div id="settings" hidden></div>
      <section id="search-view" hidden>
        <h1 class="visually-hidden" data-i18n="common.name"></h1>
        <form class="search" role="search">
          <label for="q" class="visually-hidden" data-i18n="search.label"></label>
          <input id="q" name="q" data-focus-target type="search" data-i18n="search.placeholder" data-i18n-attr="placeholder" autocomplete="off" enterkeyhint="search">
        </form>
        <p id="status" class="muted" role="status" aria-live="polite" data-i18n="search.hint"></p>
        <ul id="results" class="results"></ul>
      </section>
    </main>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
